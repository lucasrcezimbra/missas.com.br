[project]
name = "missas"
version = "0.0.0"
description = ""
authors = []
requires-python = ">=3.12,<4"
dependencies = [
  "dj-database-url==3.1.2",
  "django==5.2.7",
  "django-extensions==4.1",
  "django-htmx==1.29.0",
  "django-model-utils==5.0.0",
  "fontawesomefree==6.6.0",
  "googlemaps==4.10.0",
  "gunicorn==26.2.0",
  "python-decouple==3.8",
  "sentry-sdk[django]==2.68.1",
  "whitenoise[brotli]==6.12.0",
]

[dependency-groups]
dev = [
  "cruft==2.16.0",
  "freezegun==1.5.5",
  "model-bakery==1.24.0",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-deadfixtures==3.1.0",
  "pytest-cov==7.1.0",
  "pytest-django==4.14.0",
  "pytest-mock==3.15.1",
]
scrapers = [
  "llm==0.33",
  "scrapy==2.14.1",
]


[tool.djlint]
blank_line_after_tag="endblock,extends"
blank_line_before_tag="block"


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "missas.settings"
python_files = "tests.py test_*.py *_tests.py"


[tool.ruff]
select = ["E", "F", "I", "N804", "N805", "S"]
ignore = ["E501"]
line-length = 88

[tool.ruff.per-file-ignores]
"**/tests/**" = ["S101"]
